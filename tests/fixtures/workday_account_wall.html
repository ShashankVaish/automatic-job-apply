<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fixture Corp Careers - Workday</title></head>
<body>
<!-- Workday asking for an account before showing any form. -->
<div data-automation-id="jobPostingHeader">Associate Software Engineer</div>
<p>Fixture Corp. Noida. 0-1 years of experience. Python and SQL.</p>
<div data-automation-id="applyFlowPage">
  <h2>Sign In</h2>
  <label for="wd-email">Email Address</label>
  <input data-automation-id="email" id="wd-email" type="email">
  <label for="wd-pass">Password</label>
  <input data-automation-id="password" id="wd-pass" type="password">
  <button data-automation-id="createAccountSubmitButton">Create Account</button>
  <a data-automation-id="createAccountLink" href="#">Create Account</a>
  <button data-automation-id="bottom-navigation-next-button">Next</button>
</div>
</body></html>
