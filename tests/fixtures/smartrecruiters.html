<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Graduate Engineer - Fixture Global</title></head>
<body>
<!-- Mimics a jobs.smartrecruiters.com application form. -->
<h1>Graduate Engineer</h1>
<p>Fixture Global is hiring graduate engineers. Python, SQL and JavaScript.
0-1 years of experience. Noida.</p>
<form name="applicationForm" id="application-form" enctype="multipart/form-data">
  <label for="firstName">First name *</label>
  <input id="firstName" name="firstName" type="text" required>
  <label for="lastName">Last name *</label>
  <input id="lastName" name="lastName" type="text" required>
  <label for="email">Email *</label>
  <input id="email" name="email" type="email" required>
  <label for="phoneNumber">Phone number</label>
  <input id="phoneNumber" name="phoneNumber" type="tel">
  <label for="location">Location</label>
  <input id="location" name="location" type="text">
  <label for="linkedinProfileUrl">LinkedIn profile</label>
  <input id="linkedinProfileUrl" name="linkedinProfileUrl" type="text">
  <label for="websiteUrl">Website</label>
  <input id="websiteUrl" name="websiteUrl" type="text">
  <label for="sr-resume">Resume *</label>
  <input id="sr-resume" name="resume" type="file">
  <label for="sr-cover">Cover letter</label>
  <textarea id="sr-cover" name="coverLetter"></textarea>
  <label><input type="checkbox" id="consent" name="consent" required>
    I have read and accept the privacy policy</label>
  <button type="submit">Apply</button>
</form>
</body></html>
